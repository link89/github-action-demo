name: Build Images
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
    paths-ignore:
      - 'scripts/**'
      - '**/[Rr][Ee][Aa][Dd][Mm][Ee].[Mm][Dd]'
      - '**/[Aa][Gg][Ee][Nn][Tt].[Mm][Dd]'
      - '**/[Aa][Gg][Ee][Nn][Tt][Ss].[Mm][Dd]'
  push:
    branches: [ main ]
    paths-ignore:
      - 'scripts/**'
      - '**/[Rr][Ee][Aa][Dd][Mm][Ee].[Mm][Dd]'
      - '**/[Aa][Gg][Ee][Nn][Tt].[Mm][Dd]'
      - '**/[Aa][Gg][Ee][Nn][Tt][Ss].[Mm][Dd]'

jobs:
  build:
    name: Build ${{ matrix.variant }}
    permissions:
      packages: write
      contents: read

    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '' }}
      BUILD_SCRIPT: ${{ matrix.script }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - variant: cpu
            script: cp2k/make-cpu.sh
          - variant: cuda
            script: cp2k/make-cuda.sh
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          swap-storage: false
          large-packages: false
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          docker-images: true

      - name: Checkout
        uses: actions/checkout@v3

      - name: Run build script
        env:
          GITHUB_TOKEN: ${{ github.event_name == 'push' && secrets.GITHUB_TOKEN || '' }}
        run: |
          "$BUILD_SCRIPT"

      - name: Upload dependency locks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp2k-${{ matrix.variant }}-conda-locks
          path: /mnt/scratch/cp2k-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}/dist/*-explicit.txt
          if-no-files-found: ignore
