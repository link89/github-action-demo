name: Build CP2K Image
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
  push:
    branches: [ main ]

jobs:
  build:
    permissions:
      packages: write
      contents: read

    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          swap-storage: false
          large-packages: false
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          docker-images: true

      - name: Checkout
        uses: actions/checkout@v3

      - name: Run build script
        env:
          GITHUB_TOKEN: ${{ github.event_name == 'push' && secrets.GITHUB_TOKEN || '' }}
        run: |
          ./cp2k/2025.1-dp302-cu124-omp/build.sh
